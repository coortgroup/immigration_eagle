name: Deploy FILLOUT IMMIGRATION FORMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pdf
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_SUPABASE_URL: 'https://ceoliqoctkgwkphbmkiv.supabase.co'
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_FKXdjwUf6t0PjajntcvqiQ_EcP46vDI'
          EXPO_PUBLIC_ENABLE_LIVE_AI: 'false'
          EXPO_PUBLIC_ENABLE_AI_PAYMENTS: 'false'
          EXPO_PUBLIC_PAYMENT_TEST_BUILD: 'false'
          CI: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
