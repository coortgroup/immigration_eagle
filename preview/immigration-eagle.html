  function evaluateQualification(schema, answers) {
    if(!schema?.questions?.length)return {status:'review',index:0,reason:'A specialist needs to review the requirements for this form.'};
    for(let index=0;index<schema.questions.length;index++) {
      const question=schema.questions[index], answer=answers[question.id];
      if(!['yes','no'].includes(answer))return {status:'checking',index};
      const outcome=question[answer];
      if(outcome==='stop')return {status:'stopped',index,reason:question.stopReason||question.reason||'Your answer does not match the purpose of this form.'};
      if(outcome==='review')return {status:'review',index,reason:question.reviewReason||question.reason||'Your situation needs an individual review before you continue.'};
      if(outcome!=='next')return {status:'review',index,reason:'We need to confirm the requirements before you continue.'};
    }
    return {status:'passed',index:schema.questions.length};
  }

    if(target.dataset.preparationMode){beginPreparation(target.dataset.preparationMode);return true;}
    const action=target.dataset.flowAction;
    if(target.dataset.checkAnswer) {
      if(state.route!=='qualification'||!preparation)return true;
      const schema=qualificationSchema(),q=schema.questions[preparation.index];
      const changed=preparation.answers[q.id]!==target.dataset.checkAnswer;
      preparation.answers[q.id]=target.dataset.checkAnswer;
      if(changed)for(const later of schema.questions.slice(preparation.index+1))delete preparation.answers[later.id];
      preparation.result={status:'checking'};render();
      view.querySelector(`[data-check-answer="${target.dataset.checkAnswer}"]`)?.focus({preventScroll:true});return true;
    }
    if(target.dataset.editDraft!==undefined) {
      if(canPrepare()&&preparation.mode==='ai') {preparation.step=Number(target.dataset.editDraft);render();}return true;
    }
    if(!action)return false;
    if(!preparation)return true;
    if(action==='previous-check') {
      if(preparation.index>0){preparation.index--;preparation.result={status:'checking'};render();}else navigate('form');
    }
    if(action==='next-check'&&state.route==='qualification') {
      const q=qualificationSchema().questions[preparation.index];if(!['yes','no'].includes(preparation.answers[q.id]))return true;
      const prefix=Object.fromEntries(qualificationSchema().questions.slice(0,preparation.index+1).map(question=>[question.id,preparation.answers[question.id]]));
      const result=evaluateQualification(qualificationSchema(),prefix);
      preparation.result=result;
      if(result.status==='checking'){preparation.index=result.index;navigate('qualification');}else navigate('qualification-result');
    }
    if(action==='uncertain-check') {for(const question of qualificationSchema().questions.slice(preparation.index))delete preparation.answers[question.id];preparation.result={status:'review',index:preparation.index,reason:'You are not sure about a requirement. Our team can help confirm which path applies to you.'};navigate('qualification-result');}
    if(action==='review-check'){preparation.index=0;preparation.result={status:'checking'};navigate('qualification');}
    if(action==='request-review') {
      contactDraft.topic='Choosing a form';contactDraft.message=`Please help me review the requirements for ${state.formId}.`;navigate('contact');
    }
    if(action==='continue-preparation'&&canPrepare())navigate(preparation.mode==='ai'?'prepare-ai':'attorney-intake');
    if(action==='previous-interview'&&canPrepare()) {if(preparation.step>0){preparation.step--;render();}else navigate('qualification-result');}
    if(action==='review-draft'&&canPrepare()) {preparation.step=interviewSchema().fields.length;render();}
    if(action==='next-interview'&&canPrepare()) {
      const field=view.querySelector('#eagle-interview-answer');
      if(!field.value.trim()||!field.validity.valid){showFlowError('#eagle-interview-error',field.type==='date'?'Enter a valid date. A birth date cannot be in the future.':'Please enter a valid answer.',field);return true;}
      preparation.draft[field.dataset.draftField]=field.value.trim();preparation.step++;render();view.querySelector('#eagle-interview-answer')?.focus({preventScroll:true});
    }
    if(action==='preview-intake'&&canPrepare()) {
      const fields=[...view.querySelectorAll('[data-intake-field]')];
      fields.forEach(field=>field.removeAttribute('aria-invalid'));
      const invalid=fields.find(field=>(field.required&&!field.value.trim())||!field.validity.valid);
      if(invalid){showFlowError('#eagle-intake-error','Please enter valid contact details.',invalid);return true;}
      const email=preparation.intake.email?.trim(),phoneValue=preparation.intake.phone?.trim();
      if(!email&&!phoneValue){showFlowError('#eagle-intake-error','Enter an email address or phone number.',fields.find(f=>f.dataset.intakeField==='email'));return true;}
      if(phoneValue&&(!/^[+\d\s().-]+$/.test(phoneValue)||phoneValue.replace(/\D/g,'').length<7||phoneValue.replace(/\D/g,'').length>15)){showFlowError('#eagle-intake-error','Enter a valid phone number.',fields.find(f=>f.dataset.intakeField==='phone'));return true;}
      preparation.intakePreview=true;render();
    }
    if(action==='edit-intake'&&canPrepare()){preparation.intakePreview=false;render();}
    return true;
  }
  root.addEventListener('input',event=>{
    if(!canPrepare())return;
    const field=event.target;
    if(field.dataset.draftField)preparation.draft[field.dataset.draftField]=field.value;
    if(field.dataset.intakeField)preparation.intake[field.dataset.intakeField]=field.value;
  });

  function restore(saved) {
    const s=saved?.privateContent;
    if(!s) return;
    if(routes.includes(s.route)) state.route=preparationRoutes.includes(s.route)&&preparation?.formId!==s.formId?'form':s.route;
    if(s.completed===2 || s.completed===3) state.completed=s.completed;
    state.attached=s.attached===true;
    if(forms.some(f=>f.id===s.formId))state.formId=s.formId;
    if(['home','services'].includes(s.formBack))state.formBack=s.formBack;
    if(typeof s.otherFormsOpen==='boolean')state.otherFormsOpen=s.otherFormsOpen;
  }
  const persistedState = () => ({route:state.route,completed:state.completed,attached:state.attached,formId:state.formId,formBack:state.formBack,otherFormsOpen:state.otherFormsOpen});
  function remember() {
    window.openai?.setWidgetState?.({modelContent:{design:'Immigration Eagle',screen:state.route},privateContent:persistedState()}).catch(()=>{});
  }
  function closeSheet(restoreFocus=true) {
    overlay.hidden=true;
    view.inert=false;
    root.querySelector('.eagle-nav').inert=false;
    if(restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    returnFocus=null;
  }
  function render() {
    closeSheet(false);
    if(preparationRoutes.includes(state.route)&&(!preparation||preparation.formId!==state.formId))state.route='form';
    if(['prepare-ai','attorney-intake'].includes(state.route)&&!canPrepare())state.route='qualification-result';
    view.innerHTML=({home,application,question,documents,ai,services,form,contact,qualification,'qualification-result':qualificationResult,'prepare-ai':prepareAi,'attorney-intake':attorneyIntake})[state.route]();
    if(state.route==='contact')for(const key of Object.keys(contactDraft))view.querySelector('#eagle-contact-'+key).value=contactDraft[key];
    const active=['question','documents'].includes(state.route)?'application':['services','form',...preparationRoutes].includes(state.route)?'home':state.route==='contact'?'ai':state.route;
    root.querySelectorAll('.eagle-nav [data-route]').forEach(b=>{if(b.dataset.route===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    root.querySelector('.eagle-nav-logo').innerHTML=logo('');
    updateIcons();
  }
  function navigate(route) {
    if(!routes.includes(route))return;
    state.route=route; render(); remember();
    phone.scrollIntoView({block:'start',behavior:'instant'});
    view.querySelector('button')?.focus({preventScroll:true});
  }
  function notify(message) {
    const toast=root.querySelector('.eagle-toast'); toast.textContent=message; toast.classList.add('visible');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('visible'),3200);
  }
  function sheet(title,content) {
    returnFocus=document.activeElement;
    overlay.innerHTML=`<section class="eagle-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="eagle-sheet-title"><div class="eagle-sheet-top"><h2 id="eagle-sheet-title">${title}</h2>${button(icon('x'),'data-action="close-sheet" aria-label="Close dialog"','eagle-icon-button')}</div>${content}</section>`;
    overlay.hidden=false; view.inert=true; root.querySelector('.eagle-nav').inert=true;
    updateIcons(); phone.scrollIntoView({block:'start',behavior:'instant'}); overlay.querySelector('button').focus({preventScroll:true});
  }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button'); if(!target)return;
    if(handlePreparationClick(target))return;
    if(target.dataset.route) { navigate(target.dataset.route); return; }
    if(target.dataset.form) {
      if(!forms.some(f=>f.id===target.dataset.form))return;
      if(state.route!=='form')state.formBack=state.route==='home'?'home':'services';
      state.formId=target.dataset.form; navigate('form'); return;
    }
    if(target.dataset.prompt) {
      const prompt=prompts.find(p=>p[2]===target.dataset.prompt);
      state.chat.push({kind:prompt[2],question:prompt[1]}); render(); view.querySelector('textarea[name="question"]')?.focus({preventScroll:true}); return;
    }
    if(target.dataset.file!==undefined) { sheet('Sample document','<p>This is an illustrative file for the design preview.</p>'+button('Done','data-action="close-sheet"')); return; }
    const action=target.dataset.action;
    if(action==='close-sheet')closeSheet();
    if(action==='profile')sheet('Your account','<p>Alex Rivera · Sample account</p>'+button(icon('rotate-ccw')+' Reset sample progress','data-action="reset"','eagle-ai-suggestion')+button('Ask Eagle AI','data-route="ai"'));
    if(action==='clear-search') { state.query=''; view.querySelector('#eagle-catalog-search').value=''; updateCatalog(); view.querySelector('#eagle-catalog-search').focus(); }
    if(action==='preview-contact') {
      const name=view.querySelector('#eagle-contact-name'), email=view.querySelector('#eagle-contact-email'), phoneField=view.querySelector('#eagle-contact-phone'), message=view.querySelector('#eagle-contact-message'), error=view.querySelector('#eagle-contact-error');
      for(const field of [name,email,phoneField,message]) { field.removeAttribute('aria-invalid'); field.setAttribute('aria-describedby',[email,phoneField].includes(field)?'eagle-contact-help':''); }
      const issues=[];
      if(!name.value.trim())issues.push([name,'Please enter your name.']);
      if(!email.value.trim()&&!phoneField.value.trim())issues.push([email,'Enter an email address or phone number.']);
      if(email.value.trim()&&!email.validity.valid)issues.push([email,'Enter a valid email address.']);
      if(phoneField.value.trim()&&!/^[+\d\s().-]+$/.test(phoneField.value.trim()))issues.push([phoneField,'Enter a valid phone number.']);
      if(phoneField.value.trim()&&(phoneField.value.replace(/\D/g,'').length<7||phoneField.value.replace(/\D/g,'').length>15))issues.push([phoneField,'Enter a phone number with 7 to 15 digits.']);
      if(!message.value.trim())issues.push([message,'Please enter your question.']);
      if(issues.length) { error.textContent=issues[0][1]; error.hidden=false; const field=issues[0][0]; field.setAttribute('aria-invalid','true'); field.setAttribute('aria-describedby',([email,phoneField].includes(field)?'eagle-contact-help ':'')+'eagle-contact-error'); field.focus(); return; }
      error.hidden=true;
      const topic=view.querySelector('#eagle-contact-topic').value;
      const compactMessage=message.value.trim().replace(/\s+/g,' ');
      const excerpt=compactMessage.length>220?compactMessage.slice(0,220)+'…':compactMessage;
      const details=[name.value.trim(),email.value.trim(),phoneField.value.trim(),topic].filter(Boolean).map(escape).join('<br>');
      sheet('Your request preview',`<p>No request has been sent. This is a local preview of the details our team will receive.</p><div class="eagle-contact-preview">${details}<br><br>${escape(excerpt)}</div>${compactMessage.length>220?'<p>Question excerpt. Return to the form to see your full draft.</p>':''}${button('Back to form','data-action="close-sheet"')}`);
    }
    if(action==='complete') { state.completed=3; navigate('application'); notify('Sample section saved. Your progress is now 50%.'); }
    if(action==='section') { const index=Number(target.dataset.section); sheet(sections[index],'<p>This section is part of the sample checklist. Try the Address history screen to preview the question flow.</p>'+button('Preview address questions','data-route="question"')); }
    if(action==='add-document')sheet('Add a document','<p>Try the sample flow. No camera or personal files are accessed.</p>'+button(icon('scan-line')+' Scan a document','data-action="attach"','eagle-ai-suggestion')+button(icon('folder-open')+' Choose from Files','data-action="attach"','eagle-ai-suggestion'));
    if(action==='attach') { state.attached=true; render(); remember(); notify('Sample document added. No file was uploaded.'); }
    if(action==='clear-chat') { state.chat=[]; state.aiFormId=''; render(); view.querySelector('textarea[name="question"]')?.focus({preventScroll:true}); }
    if(action==='send-chat')sendChat();
    if(action==='reset') { preparation=null; Object.assign(state,{route:'home',completed:2,attached:false,chat:[],aiFormId:'',finderStatus:'',finderGoal:'',query:'',formId:'N-400',formBack:'services',otherFormsOpen:false}); Object.assign(contactDraft,{name:'',email:'',phone:'',message:'',topic:'Application support'}); render(); remember(); }
  });
  root.addEventListener('toggle',event=>{
    if(event.target.matches('.eagle-other-forms')&&state.otherFormsOpen!==event.target.open) { state.otherFormsOpen=event.target.open; remember(); }
  },true);
  function updateCatalog() {
    view.querySelector('#eagle-catalog-results').innerHTML=catalogRows();
    view.querySelector('#eagle-result-count').textContent=`${matchingForms().length} of ${forms.length} forms`;
    updateIcons();
  }
  root.addEventListener('input',event=>{
    if(event.target.id==='eagle-catalog-search') { state.query=event.target.value.slice(0,150); updateCatalog(); }
    for(const key of ['name','email','phone','message'])if(event.target.id==='eagle-contact-'+key)contactDraft[key]=event.target.value;
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='eagle-contact-topic')contactDraft.topic=event.target.value;
    if(event.target.id==='eagle-status-select') {
      state.finderStatus=event.target.value; state.finderGoal='';
      const goal=view.querySelector('#eagle-goal-select');
      goal.innerHTML=goalOptions(); goal.disabled=!selectedStatus();
      view.querySelector('#eagle-form-results').innerHTML=finderResults(); updateIcons();
    }
    if(event.target.id==='eagle-goal-select') {
      state.finderGoal=event.target.value;
      view.querySelector('#eagle-form-results').innerHTML=finderResults(); updateIcons();
    }
  });
  function sendChat() {
    const input=view.querySelector('textarea[name="question"]');
    const question=input.value.trim(); if(!question)return;
    state.chat.push({kind:'custom',question:question.slice(0,2000)}); render(); view.querySelector('textarea[name="question"]')?.focus({preventScroll:true});
  }
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&!event.shiftKey&&event.target.matches('.eagle-chat-form textarea')) { event.preventDefault(); sendChat(); return; }
    if(overlay.hidden)return;
    if(event.key==='Escape') { event.preventDefault(); closeSheet(); }
    if(event.key==='Tab') { const items=[...overlay.querySelectorAll('button,a,input')]; const first=items[0],last=items.at(-1); if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();} }
  });
  restore(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){const previous=JSON.stringify(persistedState());restore(saved);if(JSON.stringify(persistedState())!==previous)render();}});
  if(globalThis.Tweak) {
    const design={radius:20}; const tweak=new Tweak({container:phone,onChange:()=>phone.style.setProperty('--eagle-radius',design.radius+'px')});
    tweak.addSlider(design,'radius',{label:'Card corner radius',min:12,max:24,step:1,unit:'px'});
  }
})();
</script>
